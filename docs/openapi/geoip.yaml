openapi: 3.1.0
info:
  title: CyberSec Toolkit — GeoIP Workflow API
  version: 9.0.0
servers: [{ url: /api }]
security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    GeoIPRequest:
      type: object
      required: [target]
      additionalProperties: false
      properties: { target: { type: string, minLength: 1, maxLength: 20000 } }
    GeoIPResult:
      type: object
      required: [mode, target]
      properties:
        mode: { type: string, enum: [single, asn, batch] }
        target: { type: string }
        total: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        rejected: { type: array, items: { type: object } }
        skipped: { type: array, items: { type: object } }
        rows: { type: array, items: { type: object } }
        ip_results: { type: array, items: { type: object } }
        warnings: { type: array, items: { type: object } }
    GeoIPEnvelope:
      type: object
      properties:
        runId: { type: string }
        tool: { type: string, enum: [geoip] }
        target: { type: string }
        status: { type: string }
        data: { $ref: '#/components/schemas/GeoIPResult' }
paths:
  /tools/geoip:
    post:
      summary: Classify and look up one or more GeoIP targets
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoIPRequest' } } }
      responses:
        '200': { description: Synchronous result, content: { application/json: { schema: { $ref: '#/components/schemas/GeoIPEnvelope' } } } }
        '202': { description: Queued result, headers: { Location: { schema: { type: string } } } }
    get:
      summary: Compatibility GET for the unified GeoIP endpoint
      parameters: [{ name: target, in: query, required: true, schema: { type: string, maxLength: 20000 } }]
      responses: { '200': { description: GeoIP result } }
  /tools/geoip/me:
    get: { summary: Look up the caller's public IP, responses: { '200': { description: GeoIP result } } }
  /tools/geoip/history:
    get:
      summary: List GeoIP history including legacy runs
      parameters: [{ name: tool, in: query, schema: { type: string, enum: [GEOIP, GEOIP_BULK, GEOIP_CIDR, ASN] } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { '200': { description: Recent runs } }
    delete: { summary: Delete terminal GeoIP history, responses: { '200': { description: Deleted count } } }
  /tools/geoip_bulk:
    post: { deprecated: true, summary: Deprecated bulk adapter, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [targets], properties: { targets: { type: array, items: { type: string } } } } } } }, responses: { '200': { description: Unified result }, '202': { description: Queued result } } }
  /tools/geoip/cidr:
    get: { deprecated: true, summary: Deprecated CIDR adapter, parameters: [{ name: target, in: query, required: true, schema: { type: string } }], responses: { '200': { description: Unified result } } }
  /tools/asn:
    get: { deprecated: true, summary: Deprecated ASN adapter, parameters: [{ name: asn, in: query, required: true, schema: { type: string } }], responses: { '200': { description: Unified result } } }
    post: { deprecated: true, summary: Deprecated ASN adapter, responses: { '200': { description: Unified result } } }
